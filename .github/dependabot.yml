# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
enable-beta-ecosystems: true  # Required to use the pre-commit ecosystem
multi-ecosystem-groups:
  ruff:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  ty-checker:
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: "uv"
    directory: "/"  # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns: ["*"]
        exclude-patterns:
          - "*/astral-sh/ruff-pre-commit"
          - "*/astral-sh/ty-pre-commit"
  # Keep ruff and ty in uv.lock and pre-commit in sync with a single PR
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["ruff"]
    multi-ecosystem-group: "ruff"
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*/astral-sh/ruff-pre-commit"]
    multi-ecosystem-group: "ruff"
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["ty"]
    multi-ecosystem-group: "ty-checker"
  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns: ["*/astral-sh/ty-pre-commit"]
    multi-ecosystem-group: "ty-checker"
